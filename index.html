<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOS 授權認證驗證 | jos.com.tw/verify</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Serif+TC:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A96E;
    --gold-light: #E8D5A3;
    --gold-dark: #8B6914;
    --black: #0A0A0A;
    --off-white: #F7F5F0;
    --warm-gray: #E8E4DC;
    --text-muted: #888880;
    --success: #2D6A4F;
    --success-bg: #D8F3DC;
    --danger: #9B1D20;
    --danger-bg: #FDECEA;
    --border: rgba(201,169,110,0.25);
  }

  body {
    background: var(--black);
    color: var(--off-white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,169,110,0.08) 0%, transparent 60%),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 60px,
        rgba(201,169,110,0.015) 60px,
        rgba(201,169,110,0.015) 61px
      );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  .site-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .logo-mark {
    display: inline-block;
    width: 64px;
    height: 64px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    position: relative;
  }

  .logo-mark::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 0.5px solid rgba(201,169,110,0.4);
    border-radius: 50%;
  }

  .logo-mark svg { width: 28px; height: 28px; }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 6px;
  }

  .brand-sub {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 24px auto;
    max-width: 280px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: linear-gradient(to right, transparent, var(--gold));
  }

  .divider::after {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .divider-diamond {
    width: 5px;
    height: 5px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .page-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--off-white);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .page-desc {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    line-height: 1.7;
  }

  .search-card {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    margin-bottom: 24px;
  }

  .input-group { margin-bottom: 20px; }

  .input-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .input-wrap { position: relative; }

  .input-prefix {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--gold);
    font-weight: 500;
    pointer-events: none;
    letter-spacing: 0.05em;
  }

  .verify-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(201,169,110,0.3);
    border-radius: 8px;
    padding: 14px 16px 14px 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--off-white);
    letter-spacing: 0.1em;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    text-transform: uppercase;
  }

  .verify-input::placeholder {
    color: rgba(255,255,255,0.2);
    text-transform: none;
  }

  .verify-input:focus {
    border-color: var(--gold);
    background: rgba(201,169,110,0.06);
  }

  .verify-btn {
    width: 100%;
    background: var(--gold);
    color: var(--black);
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .verify-btn:hover { background: var(--gold-light); }
  .verify-btn:active { transform: scale(0.99); }

  .verify-btn.loading {
    background: rgba(201,169,110,0.5);
    cursor: default;
    pointer-events: none;
  }

  .or-divider {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin: 20px 0;
    position: relative;
  }

  .or-divider::before, .or-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 38%;
    height: 0.5px;
    background: rgba(255,255,255,0.1);
  }

  .or-divider::before { left: 0; }
  .or-divider::after { right: 0; }

  .qr-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .qr-hint span {
    color: var(--gold);
    cursor: pointer;
    border-bottom: 0.5px solid rgba(201,169,110,0.4);
  }

  .result-panel {
    display: none;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-panel.show { display: block; }

  .result-header {
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .result-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
  }

  .result-header-text h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .result-header-text p {
    font-size: 13px;
    opacity: 0.75;
    letter-spacing: 0.03em;
  }

  .result-panel.valid .result-header {
    background: linear-gradient(135deg, #0d2b1a 0%, #1a3d28 100%);
    border-bottom: 0.5px solid rgba(45,106,79,0.4);
  }

  .result-panel.valid .result-icon {
    background: rgba(45,106,79,0.3);
    border: 1px solid rgba(45,106,79,0.6);
    color: #74C69D;
  }

  .result-panel.valid .result-header-text h2 { color: #74C69D; }
  .result-panel.valid .result-header-text p { color: rgba(116,198,157,0.8); }

  .result-panel.invalid .result-header {
    background: linear-gradient(135deg, #2b0d0d 0%, #3d1a1a 100%);
    border-bottom: 0.5px solid rgba(155,29,32,0.4);
  }

  .result-panel.invalid .result-icon {
    background: rgba(155,29,32,0.3);
    border: 1px solid rgba(155,29,32,0.6);
    color: #E76F6F;
  }

  .result-panel.invalid .result-header-text h2 { color: #E76F6F; }
  .result-panel.invalid .result-header-text p { color: rgba(231,111,111,0.8); }

  .result-body {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 28px 32px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .info-item {
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
    padding-bottom: 16px;
  }

  .info-item.full { grid-column: 1 / -1; }

  .info-key {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .info-val {
    font-size: 14px;
    color: var(--off-white);
    font-weight: 400;
    letter-spacing: 0.03em;
  }

  .info-val.gold { color: var(--gold); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 100px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .badge.partner {
    background: rgba(201,169,110,0.15);
    color: var(--gold);
    border: 0.5px solid rgba(201,169,110,0.35);
  }

  .badge.valid {
    background: rgba(45,106,79,0.2);
    color: #74C69D;
    border: 0.5px solid rgba(45,106,79,0.4);
  }

  .partner-type-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }

  .trust-notice {
    background: rgba(201,169,110,0.05);
    border: 0.5px solid rgba(201,169,110,0.15);
    border-radius: 12px;
    padding: 20px 24px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.8;
    text-align: center;
  }

  .trust-notice strong {
    color: var(--gold);
    font-weight: 500;
  }

  .page-footer {
    text-align: center;
    margin-top: 48px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    line-height: 2;
  }

  .page-footer a {
    color: rgba(201,169,110,0.5);
    text-decoration: none;
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: rgba(0,0,0,0.8);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .fraud-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.05em;
    text-decoration: none;
    transition: color 0.2s;
  }

  .fraud-link:hover { color: #E76F6F; }

  @media (max-width: 480px) {
    .container { padding: 40px 16px 60px; }
    .search-card { padding: 24px 20px; }
    .result-header { padding: 20px 20px; }
    .result-body { padding: 20px 20px; }
    .info-grid { grid-template-columns: 1fr; }
    .brand-name { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="container">

  <header class="site-header">
    <div class="logo-mark">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="14" y="20" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="300" fill="#C9A96E" letter-spacing="1">JOS</text>
      </svg>
    </div>
    <div class="brand-name">JOS</div>
    <div class="brand-sub">Professional Cosmetic</div>
    <div class="divider"><div class="divider-diamond"></div></div>
    <h1 class="page-title">官方授權認證查詢</h1>
    <p class="page-desc">輸入授權書上的編號，即可即時驗證合作夥伴資格真偽</p>
  </header>

  <div class="search-card">
    <div class="input-group">
      <label class="input-label" for="auth-code">授權編號</label>
      <div class="input-wrap">
        <span class="input-prefix">JOS-AUTH-</span>
        <input
          class="verify-input"
          id="auth-code"
          type="text"
          placeholder="輸入後段編號"
          maxlength="12"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>
    <button class="verify-btn" id="verify-btn" onclick="doVerify()">立即驗證</button>
    <div class="or-divider">或</div>
    <p class="qr-hint">
      掃描授權書右方 QR Code 可直接跳轉此頁並自動帶入編號<br>
      如需協助請聯繫 <span onclick="alert('請前往官方 LINE @jos.tw')">官方 LINE</span>
    </p>
  </div>

  <div class="result-panel" id="result-panel">
    <div class="result-header">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-header-text">
        <h2 id="result-title"></h2>
        <p id="result-subtitle"></p>
      </div>
    </div>
    <div class="result-body" id="result-body"></div>
  </div>

  <div class="trust-notice">
    <strong>官方提醒：</strong> JOS 授權證書均具有唯一編號及防偽 QR Code。<br>
    若驗證結果顯示無效，請勿購買該商家產品，並回報至官方 LINE。
  </div>

  <a class="fraud-link" href="#" onclick="alert('請截圖並傳送至官方 LINE @jos.tw 舉報')">
    ⚑ 舉報疑似假冒授權商家
  </a>

  <footer class="page-footer">
    <div>© 2026 JOS PROFESSIONAL COSMETIC ·喬斯生技實業社 </div>
    <div><a href="#">www.jos.com.tw</a> · <a href="#">官方 LINE @jos.tw</a></div>
  </footer>

</div>

<script>
const MOCK_DB = {
  "0521": {
    name: "美感美學工作室",
    code: "JOS-AUTH-0521",
    serialNo: "JB052100521",
    types: ["官方合作店家", "官方體驗據點"],
    address: "台北市大安區忠孝東路四段 100 號",
    validFrom: "2026.05.21",
    validTo: "2027.05.20",
    status: "valid"
  },
  "0322": {
    name: "光感美容沙龍",
    code: "JOS-AUTH-0322",
    serialNo: "JB032200322",
    types: ["官方授權經銷"],
    address: "新北市板橋區文化路一段 88 號",
    validFrom: "2026.03.22",
    validTo: "2027.03.21",
    status: "valid"
  },
  "9999": { status: "expired", reason: "授權期限已屆滿" }
};

function lookupCode(code) {
  return new Promise(resolve => {
    setTimeout(() => {
      resolve(MOCK_DB[code.toUpperCase()] || { status: "notfound" });
    }, 1100);
  });
}

async function doVerify() {
  const input = document.getElementById('auth-code').value.trim().toUpperCase();
  if (!input) {
    document.getElementById('auth-code').focus();
    document.getElementById('auth-code').style.borderColor = '#E76F6F';
    setTimeout(() => document.getElementById('auth-code').style.borderColor = '', 1200);
    return;
  }
  const btn = document.getElementById('verify-btn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="spinner"></span>驗證中…';
  const result = await lookupCode(input);
  btn.classList.remove('loading');
  btn.innerHTML = '立即驗證';
  showResult(result, input);
}

function showResult(data, code) {
  const panel = document.getElementById('result-panel');
  const icon = document.getElementById('result-icon');
  const title = document.getElementById('result-title');
  const subtitle = document.getElementById('result-subtitle');
  const body = document.getElementById('result-body');
  panel.className = 'result-panel show';

  if (data.status === 'valid') {
    panel.classList.add('valid');
    icon.textContent = '✓';
    title.textContent = '驗證通過 — 正式授權夥伴';
    subtitle.textContent = '本授權書為 JOS 官方簽發，效期內有效';
    body.innerHTML = `
      <div class="info-grid">
        <div class="info-item">
          <div class="info-key">授權編號</div>
          <div class="info-val gold">${data.code}</div>
        </div>
        <div class="info-item">
          <div class="info-key">驗證序號</div>
          <div class="info-val">${data.serialNo}</div>
        </div>
        <div class="info-item full">
          <div class="info-key">授權店家</div>
          <div class="info-val">${data.name}</div>
        </div>
        <div class="info-item">
          <div class="info-key">授權起始</div>
          <div class="info-val">${data.validFrom}</div>
        </div>
        <div class="info-item">
          <div class="info-key">授權到期</div>
          <div class="info-val">${data.validTo}</div>
        </div>
        <div class="info-item full">
          <div class="info-key">授權資格</div>
          <div class="partner-type-row">
            ${data.types.map(t => `<span class="badge partner">● ${t}</span>`).join('')}
            <span class="badge valid">授權有效中</span>
          </div>
        </div>
        <div class="info-item full" style="border-bottom:none;padding-bottom:0">
          <div class="info-key">據點地址</div>
          <div class="info-val">${data.address}</div>
        </div>
      </div>`;
  } else {
    panel.classList.add('invalid');
    icon.textContent = '✗';
    title.textContent = data.status === 'expired' ? '授權已過期' : '查無此授權編號';
    subtitle.textContent = data.status === 'expired' ? (data.reason || '此授權書已超出有效期限') : `JOS-AUTH-${code} 不在官方授權資料庫中`;
    body.innerHTML = `
      <div style="padding:8px 0;font-size:14px;color:rgba(255,255,255,0.6);line-height:1.9;">
        <p style="margin-bottom:12px;">可能原因：</p>
        <ul style="list-style:none;padding:0;">
          <li style="padding:6px 0;border-bottom:0.5px solid rgba(255,255,255,0.07)">· 編號輸入錯誤，請重新確認授權書上的完整編號</li>
          <li style="padding:6px 0;border-bottom:0.5px solid rgba(255,255,255,0.07)">· 授權書為偽造或未經官方認可</li>
          <li style="padding:6px 0">· 如確認編號正確，請截圖聯繫 JOS 官方 LINE 核查</li>
        </ul>
      </div>`;
  }
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('auth-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') doVerify();
});

(function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    document.getElementById('auth-code').value = code;
    setTimeout(doVerify, 600);
  }
})();
</script>
</body>
</html>
